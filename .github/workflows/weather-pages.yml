name: Update weather and publish

on:
  workflow_dispatch:
  schedule:
    # 05:23, 11:23, 17:23 and 23:23 JST. GitHub cron uses UTC.
    - cron: '23 2,8,14,20 * * *'

permissions:
  contents: read

concurrency:
  group: weather-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Set up native weather importer
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: '0.13.6'
          python-version: '3.13'
          enable-cache: true
          cache-dependency-glob: |
            scripts/update-weather-native.py
            tests/ecmwf_test.py
      - run: npm run test:weather-import
      - name: Cache static terrain
        uses: actions/cache@v5
        with:
          path: |
            .cache/terrain
            .cache/ecmwf/static
          key: terrain-v1-${{ runner.os }}-${{ hashFiles('scripts/terrain_surface.py', 'src/data/japan-land.json', 'src/weather/config.json') }}
      - name: Fetch JMA MSM and ECMWF IFS forecasts
        run: npm run weather:update
      - name: Read Pages configuration
        id: pages
        uses: actions/configure-pages@v5
      - name: Build site with fresh weather data
        env:
          SITE_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: npm run build -- --base="$SITE_BASE_PATH/"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish site and weather data
        id: deployment
        uses: actions/deploy-pages@v5
