name: Update weather and publish

on:
  workflow_dispatch:
  schedule:
    # 05:23, 11:23, 17:23 and 23:23 JST. GitHub cron uses UTC.
    - cron: '23 2,8,14,20 * * *'

permissions:
  contents: read

concurrency:
  group: weather-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Fetch ECMWF IFS forecasts
        run: npm run weather:update
      - name: Read Pages configuration
        id: pages
        uses: actions/configure-pages@v5
      - name: Build site with fresh weather data
        env:
          SITE_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: npm run build -- --base="$SITE_BASE_PATH/"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish site and weather data
        id: deployment
        uses: actions/deploy-pages@v5
